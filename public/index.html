<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>
    // Apply the saved appearance before anything paints
    (function () { try { var t = localStorage.getItem('sg_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {} })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Groups</title>
  <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg?v=2">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
